name: CI

# Unit tests for every push to main and every pull request. A successful run on a push to
# main triggers publish-apk.yml (the APK release lives in its own workflow).
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'metadata/**'
      # Workflow-only changes do not change the app: no CI run on main, so no new release.
      # (Pull requests still run CI for every change.)
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Robolectric downloads android-all jars at test runtime; cache them.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-4.12.1-sdk31-34

      - name: Fetch sherpa-onnx AAR
        run: chmod +x gradlew && ./scripts/fetch-sherpa-aar.sh

      # fdroid flavor: no Firebase google-services.json needed. A few upstream tests wait on
      # wall-clock timeouts and fail intermittently on busy runners; the script re-runs up to
      # 3 failed classes once and names them in the job summary (see its header).
      # CI_VERSION_NAME: build the way a fork release does (its own version, unrelated to
      # upstream's), so upstream-keyed lookups that leak the fork version fail here.
      - name: Run unit tests (fdroid debug)
        timeout-minutes: 45
        env:
          CI_VERSION_NAME: 1.2.0
        run: ./scripts/ci/unit-tests-retry-flaky.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
