name: Android CI/CD

# Fork workflow: unit tests on every push/PR to main; a GitHub Release (APKs only) for every
# pushed tag v* or a manual run with a tag. No Play Store, F-Droid or store-listing steps.
#
# Optional repository secrets:
#   KEYSTORE_BASE64      base64 of a release keystore  } both set -> the release APK is signed
#   KEYSTORE_PROPERTIES  keystore.properties content   }   (storeFile=release.keystore, ...)
#   DEBUG_KEYSTORE_BASE64  base64 of a debug.keystore -> debug APKs keep one signature across
#                          releases, so a new one installs over the previous one
# Without secrets the release still works: the debug APKs (package com.antivocale.app.debug)
# install as-is; the release APK is then unsigned and must be signed before installing.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (created on the current commit if it does not exist), e.g. v1.18.0-fork.1'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Robolectric downloads android-all jars at test runtime; cache them.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-4.12.1-sdk31-34

      - name: Fetch sherpa-onnx AAR
        run: chmod +x gradlew && ./scripts/fetch-sherpa-aar.sh

      # fdroid flavor: no Firebase google-services.json needed. A few upstream tests wait on
      # wall-clock timeouts and fail intermittently on busy runners; the script re-runs up to
      # 3 failed classes once and names them in the job summary (see its header).
      - name: Run unit tests (fdroid debug)
        timeout-minutes: 45
        run: ./scripts/ci/unit-tests-retry-flaky.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/

  release:
    name: GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Fetch sherpa-onnx AAR
        run: chmod +x gradlew && ./scripts/fetch-sherpa-aar.sh

      - name: Install signing material (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets: the release APK will be unsigned."
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      # fdroid flavor = Firebase-free; -PwhistleEngineDisabled builds the stub whistle bridge
      # (the prebuilt engine is only fetched for the upstream Play build).
      - name: Build APKs
        run: ./gradlew assembleFdroidRelease assembleFdroidDebug -PwhistleEngineDisabled --console=plain

      - name: Collect release assets
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/fdroid/release/*.apk; do
            name=$(basename "$apk" .apk)
            if [ "$SIGNED_RELEASE" = "true" ]; then
              cp "$apk" "dist/anti-vocale-${TAG}-${name#app-fdroid-}.apk"
            else
              cp "$apk" "dist/anti-vocale-${TAG}-${name#app-fdroid-}-UNSIGNED.apk"
            fi
          done
          for apk in app/build/outputs/apk/fdroid/debug/*.apk; do
            name=$(basename "$apk" .apk)
            cp "$apk" "dist/anti-vocale-${TAG}-${name#app-fdroid-}.apk"
          done
          ls -l dist
          test -n "$(ls dist)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
